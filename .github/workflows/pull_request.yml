name: Build Gosherve

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Gosherve
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Launch Workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          cache: go:mod-cache

      - name: Lint gosherve
        run: |
          workshop run -- lint-fix
          git diff --exit-code

      - name: Run tests
        run: |
          workshop run -- test -v

      - name: Build snapshot
        id: build
        run: |
          workshop run -- snapshot --verbose

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: gosherve-dist
          if-no-files-found: error
          path: dist
