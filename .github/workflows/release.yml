name: Release Gosherve

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Gosherve
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Launch Workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          cache: go:mod-cache

      - name: Run tests
        run: |
          workshop run -- test -v

      - name: Release gosherve
        id: build
        run: |
          workshop exec --env GITHUB_TOKEN -- goreleaser release --verbose --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: gosherve-dist
          if-no-files-found: error
          path: dist
